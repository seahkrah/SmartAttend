# Continuous integration.
#
# The repository had no automated validation, and it showed: a router-level
# gate that broke POST /api/auth/login survived a full suite run, and 200-odd
# SQL statements naming columns that do not exist had accumulated unnoticed.
# Every check below exists because something it catches was already wrong.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Repository hygiene, migration naming, formatting and lint. Cheap, so it
  # runs first and fails fast.
  repo-and-lint:
    name: Hygiene and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No loose debug scripts, _OLD migrations, committed node_modules or
      # build output; every migration prefix used once.
      - name: Repository hygiene and migration lint
        run: npm run check:repo

      - name: Install workspace tools
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Install backend
        working-directory: apps/backend
        run: npm ci

      - name: Install frontend
        working-directory: apps/frontend
        run: npm ci

      # 0 errors, and the warning count may only go down (--max-warnings).
      - name: Lint
        run: npm run lint

  types-and-build:
    name: Types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install shared types
        working-directory: packages/types
        run: npm ci || npm install

      - name: Build shared types
        working-directory: packages/types
        run: npm run build

      - name: Install backend
        working-directory: apps/backend
        run: npm ci || npm install

      - name: Typecheck backend
        working-directory: apps/backend
        run: npx tsc --noEmit -p tsconfig.json

      # Generated from the Express routers; the fuzzer and reviewers read the
      # committed copy, so a route change must update it.
      - name: Route inventory is current
        working-directory: apps/backend
        run: npx tsx src/scripts/routeInventory.ts --check

      - name: Install frontend
        working-directory: apps/frontend
        run: npm ci || npm install

      # `vite build` does not typecheck, so a clean build says nothing about
      # type safety. This is the check that does.
      - name: Typecheck frontend
        working-directory: apps/frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build frontend
        working-directory: apps/frontend
        run: npx vite build

  database-and-api:
    name: Migrations, SQL and API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jjelo
          POSTGRES_PASSWORD: jjelo
          POSTGRES_DB: jjelotech_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jjelo:jjelo@127.0.0.1:5432/jjelotech_ci
      JWT_SECRET: ci-only-not-a-real-secret
      PORT: '5000'
      # Uploaded documents land here rather than in the checkout, so a build
      # that writes files does not leave them in the working tree.
      FILE_STORAGE_ROOT: /tmp/ci-file-storage
      FILE_STORAGE_BACKEND: local
      # Every suite calls from one address; the account endpoints' production
      # limit (30 per 15 minutes) would throttle the suites themselves. The
      # limiter's behaviour is covered by a unit test.
      RATE_LIMIT_ACCOUNT_PER_15MIN: '1000'
      RATE_LIMIT_LOGIN_PER_MINUTE: '1000'
      # The cross-tenant fuzzer makes ~20,000 requests from one address, and
      # treats a 429 as a failure rather than as a refusal.
      RATE_LIMIT_API_PER_MINUTE: '1000000'
      RATE_LIMIT_MFA_PER_15MIN: '100000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Generated per run rather than committed, so the secret scan has
      # nothing to excuse. CI templates are of synthetic faces and discarded.
      - name: Throwaway biometric template key
        run: |
          echo "BIOMETRIC_TEMPLATE_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          # Per-tenant data keys for new face templates (src/security/kms).
          echo "KMS_LOCAL_KEK=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install shared types
        working-directory: packages/types
        run: (npm ci || npm install) && npm run build

      - name: Install backend
        working-directory: apps/backend
        run: npm ci || npm install

      # Migrations must apply to an empty database, in order, without manual
      # intervention. If they do not, nothing below is meaningful.
      - name: Apply migrations
        working-directory: apps/backend
        run: npx tsx src/db/migrate.ts

      - name: Migrations are idempotent
        working-directory: apps/backend
        run: npx tsx src/db/migrate.ts

      # A database migrated under the old duplicated names (006_, 007_, ...)
      # upgrades by renaming ledger rows, never by re-running a migration.
      - name: Upgrade from the old migration names
        working-directory: apps/backend
        run: npx tsx src/scripts/checkLedgerUpgrade.ts

      # Hands every literal SQL statement to PostgreSQL's parser. Catches a
      # query naming a column that does not exist before a user does.
      # Both of these carried continue-on-error until the count reached zero.
      # A gate that cannot fail is not a gate: CI reported green for months
      # while 104 unit tests failed and 154 statements named columns that do
      # not exist. They are real now, and a regression in either fails the
      # build.
      - name: Validate SQL against the live schema
        working-directory: apps/backend
        run: node scripts/validate-sql.mjs

      # With the coverage floor in vitest.config.ts: a fall below it fails.
      - name: Unit tests (with coverage floor)
        working-directory: apps/backend
        run: npx vitest run --coverage --coverage.reporter=text-summary

      # From here on the API and the suites connect as the runtime role: not
      # the owner, not a superuser, NOBYPASSRLS. Row-level security filters
      # every tenant table for it, so the e2e suites below run against the
      # same enforcement production has. (Unit tests above read tenant
      # tables directly and run as the owner.)
      - name: Runtime database role
        working-directory: apps/backend
        run: |
          pw=$(openssl rand -hex 24)
          APP_DB_USER=jjelotech_api APP_DB_PASSWORD="$pw" npx tsx src/scripts/createRuntimeRole.ts
          echo "APP_DATABASE_URL=postgresql://jjelotech_api:${pw}@127.0.0.1:5432/jjelotech_ci" >> "$GITHUB_ENV"

      - name: Start API
        working-directory: apps/backend
        run: |
          nohup npx tsx src/server.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:5000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat /tmp/api.log; exit 1

      # Tenant isolation, platform isolation, authentication and role
      # enforcement, end to end against a real database.
      - name: End-to-end suites
        working-directory: apps/backend
        run: bash scripts/run-all-e2e.sh

      # Stamped with this commit; the scorecard job reads it.
      - name: Keep the e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/backend/.e2e-fixtures/results.tsv
          if-no-files-found: ignore

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log || true

  # Production dependencies only, failing on high or critical. Moderate
  # findings are tracked in docs/security/findings.md.
  deps-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production dependencies, high and critical)
        run: |
          (cd apps/backend && npm audit --omit=dev --audit-level=high)
          (cd apps/frontend && npm audit --omit=dev --audit-level=high)
          (cd packages/types && npm audit --omit=dev --audit-level=high)

  # The working tree, and the commits this push adds. Not the whole history:
  # it holds the credentials described in SECURITY_CREDENTIAL_ROTATION.md
  # until the owner rotates them and the purge in
  # docs/security/history-purge-plan.md runs. After the purge, scan it all.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Working tree
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          dir /repo --config /repo/.gitleaks.toml --baseline-path /repo/.gitleaks-baseline.json --redact --no-banner -v
      - name: Commits in this push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          git /repo --config /repo/.gitleaks.toml --redact --no-banner -v
          --log-opts="${{ github.event.before }}..${{ github.sha }}"

  # Semgrep's open rule packs for the languages and frameworks in use.
  # ERROR-severity findings fail the build.
  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: >-
          docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0
          semgrep scan --config p/javascript --config p/typescript --config p/expressjs --config p/react
          --exclude docs/archive --severity ERROR --error --metrics off apps scripts packages/types/src

  images:
    name: Container images
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jjelo
          POSTGRES_PASSWORD: jjelo
          POSTGRES_DB: jjelotech_images
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f apps/backend/Dockerfile -t jjelotech-api:ci .

      - name: Build the web image
        run: docker build -f apps/frontend/Dockerfile --build-arg VITE_API_BASE_URL=https://api.example.org/api -t jjelotech-web:ci .

      # Fixed HIGH and CRITICAL vulnerabilities in either image fail the build.
      - name: Scan the images
        run: |
          for image in jjelotech-api:ci jjelotech-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done

      - name: Software bill of materials
        run: |
          mkdir -p sbom
          for image in api web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" aquasec/trivy:0.57.1 \
              image --format cyclonedx --output "/out/jjelotech-$image.cdx.json" --no-progress "jjelotech-$image:ci"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

      # The image, not the checkout: migrations from an empty database, then a
      # production-mode server that must report ready.
      - name: Migrate and start the API image
        run: |
          cat > /tmp/api.env <<ENV
          NODE_ENV=production
          PORT=5000
          DATABASE_URL=postgresql://jjelo:jjelo@127.0.0.1:5432/jjelotech_images
          DATABASE_SSL=off
          JWT_SECRET=$(openssl rand -base64 48)
          PUBLIC_APP_URL=https://app.example.org
          CORS_ORIGINS=https://app.example.org
          ENV
          docker run --rm --network host --env-file /tmp/api.env jjelotech-api:ci node dist/db/migrate.js
          docker run -d --name api --network host --env-file /tmp/api.env jjelotech-api:ci
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:5000/api/health/ready && exit 0
            sleep 1
          done
          docker logs api; exit 1

      - name: The web image serves the app with its security policy
        run: |
          docker run -d --name web -p 8080:8080 -e API_ORIGIN=https://api.example.org jjelotech-web:ci
          sleep 3
          curl -sf http://127.0.0.1:8080/ > /dev/null
          curl -sfI http://127.0.0.1:8080/some/client/route | grep -q "200"
          curl -sI http://127.0.0.1:8080/ | grep -qi "content-security-policy: .*connect-src 'self' https://api.example.org"

  # A measurement, not a gate: it always exits 0. It runs last so it can see
  # every other job's result (CI_NEEDS): a gate such as "SAST ran and passed"
  # is credited from the job outcome in this run, never from the workflow
  # merely mentioning a tool. Database gates run against its own migrated
  # database; e2e gates use the results the database-and-api job stamped
  # with this commit.
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    if: always()
    needs: [repo-and-lint, types-and-build, database-and-api, deps-audit, secret-scan, sast, images]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jjelo
          POSTGRES_PASSWORD: jjelo
          POSTGRES_DB: jjelotech_score
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jjelo:jjelo@127.0.0.1:5432/jjelotech_score
      JWT_SECRET: ci-only-not-a-real-secret
      CI_NEEDS: ${{ toJSON(needs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Throwaway biometric template key
        run: |
          echo "BIOMETRIC_TEMPLATE_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          # Per-tenant data keys for new face templates (src/security/kms).
          echo "KMS_LOCAL_KEK=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install
        run: |
          npm ci
          (cd scripts/scorecard && npm ci)
          (cd packages/types && npm ci && npm run build)
          (cd apps/backend && npm ci)
          (cd apps/frontend && npm ci)

      - name: Migrate
        working-directory: apps/backend
        run: npx tsx src/db/migrate.ts

      - name: Runtime database role
        working-directory: apps/backend
        run: |
          pw=$(openssl rand -hex 24)
          APP_DB_USER=jjelotech_api APP_DB_PASSWORD="$pw" npx tsx src/scripts/createRuntimeRole.ts
          echo "APP_DATABASE_URL=postgresql://jjelotech_api:${pw}@127.0.0.1:5432/jjelotech_score" >> "$GITHUB_ENV"

      # A running API, so the runtime-role gate can ask the database which
      # role the API's own pool actually connects as.
      - name: Start API (runtime role)
        working-directory: apps/backend
        env:
          PORT: '5000'
          FILE_STORAGE_ROOT: /tmp/ci-file-storage
          FILE_STORAGE_BACKEND: local
        run: |
          nohup npx tsx src/server.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:5000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat /tmp/api.log; exit 1

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-results
          path: e2e-results

      - name: Score
        env:
          API_BASE: http://127.0.0.1:5000
          E2E_RESULTS: ${{ github.workspace }}/e2e-results/results.tsv
        run: node scripts/scorecard/run.mjs --phase ci | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: docs/scorecard/
