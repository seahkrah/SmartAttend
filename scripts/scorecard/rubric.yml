# JJELOTECH scorecard rubric.
#
# How a dimension is scored (run.mjs implements exactly this):
#   1. Each gate passes or it does not. A gate whose prerequisites (database,
#      API, e2e results stamped with this commit, a CI run) are unavailable
#      is NOT RUN, and earns nothing. Only committed files count.
#   2. Raw score = 10 x (weight of passed gates / weight of all gates).
#   3. A dimension reaches 9.0 only when every one of its gates passes;
#      otherwise it is held at 8.9 at most.
#   4. Ceiling rule: above 8.5 only when the independent audit for the
#      current phase exists (audit-<phase>.json with its audit-<phase>.md
#      report); and capped at 8.5 while any attestation listed under
#      `attestations` is missing from docs/scorecard/evidence/ (a committed
#      file of at least 1 KB, not added by a commit carrying a Claude
#      co-author trailer).
#   5. When an audit file exists, the lower of the two scores is used.
#   The composite is the weight-averaged sum of dimension scores.
#
# Gate types: files (committed, >= minBytes, default 300; docs must not call
# themselves placeholders), grep / grep-absent (committed files), cmd (exit 0),
# e2e (named suites passed in a full run at this commit), ci-job (the named
# job succeeded in this workflow run), check (scripts/scorecard/checks.mjs).
#
# Calibration. "foundation" gates prove capability that exists today. Their
# weights add up to the assessed baseline (docs/scorecard/baseline.json,
# "assessed"; e.g. tenant isolation 6.5 -> foundation weight 65 of 100), so
# the scorecard reproduces the baseline only when the evidence for it is
# there. "target" gates are the planned work and carry the rest. run.mjs
# refuses a rubric whose weights do not total 100 per dimension, whose
# foundation weight differs from baseline.json, or whose gates carry keys it
# does not know.
#
# What this does not prevent, so the independent audit must look for it:
# moving weight between gates of the same kind; a grep or files gate that a
# stub would satisfy; a gate whose title claims more than its check proves;
# an audit file the implementer wrote. Prefer e2e, cmd and ci-job gates.
#
# `reference` is the estimated score of the global class for that dimension.
# It is an estimate, not a measurement; change it only with a written reason.

phase_reference_composite: 8.7
attestations:
  pentest:
    file: docs/scorecard/evidence/pentest-report.*
    title: Independent penetration test report
  pad-lab:
    file: docs/scorecard/evidence/iso30107-3-pad-report.*
    title: ISO/IEC 30107-3 PAD lab report
  soc2-iso:
    file: docs/scorecard/evidence/soc2-or-iso27001-assessment.*
    title: SOC 2 / ISO 27001 report or formal gap assessment
  slo-30d:
    file: docs/scorecard/evidence/production-slo-30d.*
    title: 30 days of production SLO data
dimensions:
  - id: tenant-isolation
    n: 1
    title: Tenant isolation
    weight: 12
    baseline: 6.5
    reference: 9
    attestations:
      - pentest
    gates:
      - id: tenant-from-identity
        kind: foundation
        weight: 15
        title: Naming another tenant in X-Tenant-Id does not switch tenant (e2e)
        type: e2e
        suites:
          - opsRoutesIsolation
          - crossTenantAudit
      - id: cross-tenant-triggers
        kind: foundation
        weight: 10
        title: Every reference between tenant tables has a same-tenant guard (foreign keys bypass RLS)
        type: check
        check: sameTenantGuards
        requires:
          - db
      - id: scoped-helpers
        kind: foundation
        weight: 5
        title: Tenant-scoped data helpers exist
        type: files
        paths:
          - apps/backend/src/db/tenantScoped.ts
      - id: isolation-e2e
        kind: foundation
        weight: 25
        title: Cross-tenant e2e suites pass
        type: e2e
        suites:
          - crossTenantAudit
          - identityIsolation
          - legacyRoutesIsolation
          - opsRoutesIsolation
          - tenantIsolation
      - id: per-module-isolation-e2e
        kind: foundation
        weight: 10
        title: Module suites (which each include cross-tenant cases) pass
        type: e2e
        suites:
          - adminApi
          - hrApi
          - facultyApi
          - schoolAdminApi
          - feesApi
          - payrollApi
          - filesApi
      - id: rls-forced
        kind: target
        weight: 8
        title: RLS enabled and FORCED on every tenant table, with the tenant policy and no looser one
        type: check
        check: rlsCoverage
        requires:
          - db
      - id: runtime-role
        kind: target
        weight: 6
        title: The running API connects as a non-owner, non-superuser, NOBYPASSRLS role outside jjelotech_system
        type: check
        check: runtimeRole
        requires:
          - db
          - api
      - id: no-context-no-rows
        kind: target
        weight: 4
        title: A query without app.tenant_id returns no tenant rows (test)
        type: e2e
        suites:
          - rlsNoContext
      - id: raw-query-lint
        kind: target
        weight: 5
        title: 'Database access only through the tenant-bound pool: no own connections or session settings; runAsSystem and withTenant allow-listed (lint)'
        type: cmd
        run: node scripts/checks/no-raw-query.mjs
      - id: route-fuzzer
        kind: target
        weight: 5
        title: Generated cross-tenant fuzzer over the route inventory passes
        type: e2e
        suites:
          - crossTenantFuzz
      - id: blind-write
        kind: target
        weight: 2
        title: Blind-write suite (insert/update/delete across tenants) passes
        type: e2e
        suites:
          - blindWrite
      - id: storage-tenant-prefix
        kind: target
        weight: 1
        title: Storage keys carry the tenant prefix and are verified on read and removal (unit tests)
        type: cmd
        cwd: apps/backend
        run: npx vitest run src/storage/tenantKeys.test.ts
      - id: namespaced-keys
        kind: target
        weight: 1
        title: Destructive-action rate-limit keys namespaced by tenant (unit test)
        type: cmd
        cwd: apps/backend
        run: npx vitest run src/auth/rateLimitKeys.test.ts
      - id: break-glass
        kind: target
        weight: 2
        title: Superadmin cross-tenant access is break-glass, audited, tenant-visible
        type: e2e
        suites:
          - breakGlass
      - id: per-tenant-dek
        kind: target
        weight: 1
        title: Per-tenant data keys behind a KMS interface, used for face templates (unit and database tests)
        type: cmd
        cwd: apps/backend
        run: npx vitest run src/security/kms
        requires:
          - db
